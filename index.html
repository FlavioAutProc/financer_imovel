<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Empréstimos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#152033;--mut:#6b778c;--bd:#e2e7ef;--pri:#1f4fd8;--ok:#0f9d58;--okbg:#e6f6ed;--er:#d93025;--erbg:#fdeceb;--wr:#b7791f;--wrbg:#fdf6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#171f2f;--tx:#e8edf6;--mut:#8b97ad;--bd:#2a3550;--pri:#6f93ff;--ok:#3ecf8e;--okbg:#12342a;--er:#ff6b60;--erbg:#3a1a19;--wr:#e6b34d;--wrbg:#33290f}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#171f2f;--tx:#e8edf6;--mut:#8b97ad;--bd:#2a3550;--pri:#6f93ff;--ok:#3ecf8e;--okbg:#12342a;--er:#ff6b60;--erbg:#3a1a19;--wr:#e6b34d;--wrbg:#33290f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.d{color:var(--er)}
main{display:grid;grid-template-columns:270px 1fr;gap:18px;padding:18px 22px;max-width:1300px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr;padding:10px 10px 90px}}
/* ---- mobile app shell ---- */
@media(max-width:820px){
  header{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
  header h1{font-size:16px}header h1 small{font-size:11px}
  #newBtn{display:none}
  .bar>.btn{display:none}
  .more-wrap{display:block}
  .more-wrap{position:relative}
  #moreBtn{display:inline-flex}
  #moreMenu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px #0003;padding:6px;flex-direction:column;min-width:180px;z-index:20}
  #moreMenu.open{display:flex}
  #moreMenu .btn{border:none;text-align:left;border-radius:8px;padding:10px 12px}
  .side{flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .li{flex:0 0 auto;min-width:170px;padding:9px 12px}
  .fab{display:flex}
  dialog{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;width:100%;max-width:none;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:sheetUp .22s ease-out}
  dialog::backdrop{background:#0006}
  dialog::before{content:'';display:block;width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 12px}
  .f{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .parc{padding:12px 10px}
  .act{flex-direction:column-reverse}
  .act .btn{width:100%;padding:13px;font-size:15px}
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.more-wrap{}
#moreBtn{display:none}
.fab{display:none;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:26px;align-items:center;justify-content:center;box-shadow:0 6px 18px #1f4fd866;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.side{display:flex;flex-direction:column;gap:8px}
.li{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:var(--card)}.li.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.li b{display:block}.li span{color:var(--mut);font-size:12px}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.k label{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.k div{font-size:22px;font-weight:700;margin-top:4px}.k small{color:var(--mut)}
.k.ok div{color:var(--ok)}.k.er div{color:var(--er)}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0 10px}.lh h2{margin:0;font-size:16px}.lh span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.p{}.parc{border:1px dashed var(--mut);border-radius:8px;padding:10px;cursor:pointer;background:var(--card);position:relative}
.parc:hover{border-color:var(--pri)}.parc .n{font-weight:700}.parc .v{font-size:16px;font-weight:600;margin:2px 0}.parc small{color:var(--mut);display:block}
.tag{display:inline-block;margin-top:6px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.parc.paid{background:var(--okbg);border:1px solid var(--ok)}.paid .tag{background:var(--ok);color:#fff}
.parc.over{background:var(--erbg);border:1px solid var(--er)}.over .tag{background:var(--er);color:#fff}
.parc.open .tag{background:var(--wrbg);color:var(--wr)}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:20px;width:min(480px,94vw)}dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rec .btn{padding:5px 10px;font-size:12px}
.clip{position:absolute;top:6px;right:8px;font-size:13px;opacity:.75}
.warn{background:var(--wrbg);color:var(--wr);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9}
#rep{position:fixed;left:-99999px;top:0;width:1100px;background:#fff;color:#111;padding:28px;font:13px Arial,sans-serif}
#rep table{width:100%;border-collapse:collapse;margin-top:10px}#rep th{background:#1f4fd8;color:#fff;text-align:left}#rep th,#rep td{padding:5px 7px;border:1px solid #d5dbe6;font-size:11px}
</style></head><body>
<header><h1>Controle de Empréstimos<small>Carnê digital de parcelas · dados salvos neste navegador</small></h1>
<div class="bar">
<button class="btn p" id="newBtn" onclick="newLoan()">+ Novo empréstimo</button>
<button class="btn" onclick="expXlsx()">XLSX</button><button class="btn" onclick="expPdf()">PDF</button><button class="btn" onclick="expImg()">Imagem</button>
<button class="btn" onclick="backup()">Backup</button><button class="btn" onclick="$('#imp').click()">Importar</button>
<div class="more-wrap">
<button class="btn" id="moreBtn" onclick="$('#moreMenu').classList.toggle('open')">⋯</button>
<div id="moreMenu">
<button class="btn" onclick="expXlsx();closeMore()">📊 Exportar XLSX</button>
<button class="btn" onclick="expPdf();closeMore()">📄 Exportar PDF</button>
<button class="btn" onclick="expImg();closeMore()">🖼️ Exportar imagem</button>
<button class="btn" onclick="backup();closeMore()">⬇️ Backup</button>
<button class="btn" onclick="closeMore();$('#imp').click()">⬆️ Importar backup</button>
</div></div>
<input type="file" id="imp" accept=".json" hidden></div></header>
<main><aside class="side" id="side"></aside><section><div class="kpis" id="kpis"></div><div id="list"></div></section></main>
<button class="fab" onclick="newLoan()" aria-label="Novo empréstimo">+</button>

<dialog id="dl"><form method="dialog" onsubmit="return false"><h3 id="l_t">Novo empréstimo</h3><div class="f">
<label class="w">Nome / descrição<input id="l_name" required placeholder="Ex.: Financiamento do carro"></label>
<label>Credor / instituição<input id="l_cred"></label>
<label>Nº de parcelas<input id="l_n" type="number" min="1" max="600" value="12"></label>
<label>Valor da parcela (R$)<input id="l_val" type="number" step="0.01" min="0"></label>
<label>1º vencimento<input id="l_due" type="date"></label>
<label>Meio de pagamento padrão<select id="l_meth"></select></label>
<label>Conta destinatária<input id="l_acc" placeholder="Banco / ag / conta / chave PIX"></label>
<label class="w">Favorecido (nome)<input id="l_rec"></label></div>
<div id="l_warn"></div>
<div class="act"><button class="btn" onclick="$('#dl').close()">Cancelar</button><button class="btn p" id="l_save" onclick="saveLoan()">Criar carnê</button></div></form></dialog>

<dialog id="dp"><form method="dialog" onsubmit="return false"><h3 id="p_t"></h3><div class="f">
<label>Data em que foi paga<input id="p_date" type="date"></label>
<label>Valor pago (R$)<input id="p_val" type="number" step="0.01"></label>
<label>Meio de pagamento<select id="p_meth"></select></label>
<label>Conta destinatária<input id="p_acc"></label>
<label class="w">Favorecido (nome)<input id="p_rec"></label>
<label class="w"><span id="p_hint" style="color:var(--mut);font-weight:400"></span></label>
<label class="w">Observação<textarea id="p_obs" rows="2"></textarea></label>
<label class="w">Comprovante (imagem ou PDF)
 <div class="rec"><input id="p_file" type="file" accept="image/*,.pdf,application/pdf" style="flex:1;min-width:160px">
 <button type="button" class="btn" id="p_view" style="display:none" onclick="viewReceipt()">Ver</button>
 <button type="button" class="btn d" id="p_rm" style="display:none" onclick="rmReceipt()">Remover</button></div>
 <small id="p_recinfo" style="color:var(--mut)"></small></label></div>
<div class="act"><button class="btn d" id="p_undo" onclick="undoPay()">Desfazer pagamento</button><button class="btn" onclick="$('#dp').close()">Cancelar</button><button class="btn p" onclick="doPay()">Marcar como paga</button></div></form></dialog>
<div id="toast"></div><div id="rep"></div>

<script>
const $=s=>document.querySelector(s);
const METHODS=['PIX','Boleto','Transferência (TED/DOC)','Débito automático','Cartão','Dinheiro','Outro'];
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pad=n=>String(n).padStart(2,'0');
const dueOf=(s,i)=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+i,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(Math.min(d,last))};
const stOf=p=>p.paid?'paid':(p.due<today()?'over':'open');
const ST={paid:'Paga',over:'Atrasada',open:'A pagar'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,loans=[],sel='all',cur=null,editId=null,pendingReceipt=undefined,pendingRemoved=false;

// ---------- IndexedDB ----------
const idbOpen=()=>new Promise((ok,no)=>{const r=indexedDB.open('emprestimos_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('loans',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const os=m=>db.transaction('loans',m).objectStore('loans');
const dbPut=l=>rq(os('readwrite').put(l)),dbDel=id=>rq(os('readwrite').delete(id)),dbAll=()=>rq(os('readonly').getAll());
async function reload(){loans=(await dbAll()).sort((a,b)=>a.created-b.created);if(sel!=='all'&&!loans.find(l=>l.id===sel))sel='all';render()}

// ---------- utils ----------
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
function closeMore(){$('#moreMenu').classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.more-wrap'))closeMore()});
async function save(filename,data){
  const d=window.claude?await claude.use('downloads'):null;
  if(!d){toast('Download indisponível nesta visualização');return}
  try{await d.save({filename,data});toast('Arquivo salvo')}catch(e){if(e.code!=='declined')toast('Falha ao salvar: '+(e.code||e.message))}
}
const scope=()=>sel==='all'?loans:loans.filter(l=>l.id===sel);
const sum=(ps,f)=>ps.reduce((a,p)=>a+f(p),0);
const stats=ls=>{const ps=ls.flatMap(l=>l.parcels);const paid=ps.filter(p=>p.paid);return{total:sum(ps,p=>p.value),paidV:sum(paid,p=>p.paidValue??p.value),nPaid:paid.length,nOpen:ps.length-paid.length,nOver:ps.filter(p=>stOf(p)==='over').length,n:ps.length,overV:sum(ps.filter(p=>stOf(p)==='over'),p=>p.value)}};
const remaining=s=>s.total-sum([],()=>0)-s.paidV;

// ---------- render ----------
function render(){
  const s=stats(scope()),saldo=Math.max(0,s.total-sum(scope().flatMap(l=>l.parcels).filter(p=>p.paid),p=>p.value)),pct=s.n?Math.round(s.nPaid/s.n*100):0;
  $('#kpis').innerHTML=`
  <div class="card k"><label>Total da dívida</label><div>${brl(s.total)}</div><small>${s.n} parcelas</small></div>
  <div class="card k er"><label>Saldo devedor</label><div>${brl(saldo)}</div><small>${s.nOver?s.nOver+' em atraso ('+brl(s.overV)+')':'sem atrasos'}</small></div>
  <div class="card k ok"><label>Valor pago</label><div>${brl(s.paidV)}</div><small>${pct}% quitado</small></div>
  <div class="card k"><label>Parcelas pagas</label><div>${s.nPaid}</div><small>de ${s.n}</small></div>
  <div class="card k"><label>Parcelas a pagar</label><div>${s.nOpen}</div><small>restantes</small></div>`;
  const all=stats(loans);
  $('#side').innerHTML=`<div class="li ${sel==='all'?'on':''}" onclick="pick('all')"><b>Todos os empréstimos</b><span>${loans.length} contratos · ${brl(all.total)}</span></div>`+
   loans.map(l=>{const t=stats([l]);return`<div class="li ${sel===l.id?'on':''}" onclick="pick('${l.id}')"><b>${esc(l.name)}</b><span>${esc(l.creditor||'—')} · ${t.nPaid}/${t.n} pagas</span><div class="prog"><i style="width:${t.n?t.nPaid/t.n*100:0}%"></i></div></div>`}).join('');
  $('#list').innerHTML=loans.length?scope().map(l=>{const t=stats([l]);return`<div class="lh"><div><h2>${esc(l.name)}</h2><span>${esc(l.creditor||'')} · ${l.method} · ${esc(l.account||'')} · ${esc(l.recipient||'')}</span></div>
   <div><span>${brl(t.total)} · saldo ${brl(t.total-sum(l.parcels.filter(p=>p.paid),p=>p.value))}</span> <button class="btn" onclick="editLoan('${l.id}')">Editar</button> <button class="btn d" onclick="delLoan('${l.id}')">Excluir</button></div></div>
   <div class="grid">${l.parcels.map((p,i)=>`<div class="parc ${stOf(p)}" onclick="openPay('${l.id}',${i})">${p.receipt?'<span class="clip">📎</span>':''}<div class="n">Parcela ${i+1}/${l.parcels.length}</div><div class="v">${brl(p.value)}</div><small>Venc. ${fd(p.due)}</small>${p.paid?`<small>Pago em ${fd(p.paidDate)}</small>`:''}<span class="tag">${ST[stOf(p)]}</span></div>`).join('')}</div>`}).join('')
   :'<div class="card empty">Nenhum empréstimo cadastrado.<br>Clique em <b>+ Novo empréstimo</b> para gerar o carnê.</div>';
}
const pick=id=>{sel=id;render()};
document.querySelectorAll('select').forEach(s=>s.innerHTML=METHODS.map(m=>`<option>${m}</option>`).join(''));

// ---------- empréstimo ----------
function newLoan(){
  editId=null;$('#l_t').textContent='Novo empréstimo';$('#l_save').textContent='Criar carnê';$('#l_warn').innerHTML='';$('#l_n').disabled=false;
  ['name','cred','val','acc','rec'].forEach(k=>$('#l_'+k).value='');$('#l_n').value=12;$('#l_due').value=today();$('#dl').showModal()
}
function editLoan(id){
  const l=loans.find(x=>x.id===id);editId=id;
  $('#l_t').textContent='Editar empréstimo';$('#l_save').textContent='Salvar alterações';$('#l_n').disabled=false;
  $('#l_name').value=l.name;$('#l_cred').value=l.creditor||'';$('#l_n').value=l.parcels.length;$('#l_val').value=l.parcels[0]?.value??'';
  $('#l_due').value=l.parcels[0]?.due||today();$('#l_meth').value=l.method;$('#l_acc').value=l.account||'';$('#l_rec').value=l.recipient||'';
  const paidCount=l.parcels.filter(p=>p.paid).length;
  $('#l_warn').innerHTML=paidCount?`<div class="warn">Este empréstimo tem ${paidCount} parcela(s) já paga(s). Elas não serão alteradas; mudanças em valor/vencimento valem só para as parcelas ainda em aberto, e o nº de parcelas não pode ficar menor que ${paidCount}.</div>`:'';
  $('#dl').showModal();
}
async function saveLoan(){
  const name=$('#l_name').value.trim(),n=+$('#l_n').value,val=+$('#l_val').value,due=$('#l_due').value;
  if(!name||!n||!(val>0)||!due)return toast('Preencha nome, nº de parcelas, valor e 1º vencimento');
  const meta={name,creditor:$('#l_cred').value.trim(),method:$('#l_meth').value,account:$('#l_acc').value.trim(),recipient:$('#l_rec').value.trim()};
  if(!editId){
    const l={id:'l'+Date.now(),created:Date.now(),...meta,parcels:Array.from({length:n},(_,i)=>({due:dueOf(due,i),value:val,paid:false}))};
    await dbPut(l);sel=l.id;$('#dl').close();reload();return;
  }
  const l=loans.find(x=>x.id===editId),paidCount=l.parcels.filter(p=>p.paid).length;
  if(n<paidCount)return toast(`Não é possível ter menos parcelas que as ${paidCount} já pagas`);
  const parcels=Array.from({length:n},(_,i)=>{
    const old=l.parcels[i];
    if(old&&old.paid)return old;
    return{due:dueOf(due,i),value:val,paid:false};
  });
  Object.assign(l,meta);l.parcels=parcels;
  await dbPut(l);editId=null;$('#dl').close();reload();
}
async function delLoan(id){if(!confirm('Excluir este empréstimo e todo o histórico de pagamentos?'))return;await dbDel(id);reload()}

// ---------- pagamento ----------
function openPay(id,i){
  const l=loans.find(x=>x.id===id),p=l.parcels[i];cur={id,i};pendingReceipt=undefined;pendingRemoved=false;
  $('#p_t').textContent=`${l.name} — parcela ${i+1}/${l.parcels.length} (venc. ${fd(p.due)})`;
  $('#p_date').value=p.paidDate||today();$('#p_val').value=p.paidValue??p.value;
  $('#p_meth').value=p.method||l.method;$('#p_acc').value=p.account??l.account;$('#p_rec').value=p.recipient??l.recipient;$('#p_obs').value=p.note||'';
  $('#p_hint').textContent=(!p.paid&&p.due<today())
    ?`Parcela vencida em ${fd(p.due)}. Informe a data em que o pagamento foi realmente feito.`
    :'Você pode informar uma data diferente do vencimento, caso o pagamento tenha sido feito antes ou depois.';
  $('#p_file').value='';
  const has=!!p.receipt;$('#p_view').style.display=has?'':'none';$('#p_rm').style.display=has?'':'none';
  $('#p_recinfo').textContent=has?`Anexado: ${p.receiptName||'comprovante'}`:'Nenhum comprovante anexado.';
  $('#p_undo').style.display=p.paid?'':'none';$('#dp').showModal()
}
function viewReceipt(){
  const l=loans.find(x=>x.id===cur.id),p=l.parcels[cur.i];if(!p.receipt)return;
  const u=URL.createObjectURL(p.receipt);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)
}
function rmReceipt(){pendingRemoved=true;pendingReceipt=undefined;$('#p_view').style.display='none';$('#p_rm').style.display='none';$('#p_recinfo').textContent='Comprovante será removido ao salvar.'}
async function doPay(){
  const l=loans.find(x=>x.id===cur.id),p=l.parcels[cur.i];
  if(!$('#p_date').value)return toast('Informe a data do pagamento');
  const f=$('#p_file').files[0];
  if(f&&f.size>15*1024*1024)return toast('Comprovante muito grande (máx. 15 MB)');
  Object.assign(p,{paid:true,paidDate:$('#p_date').value,paidValue:+$('#p_val').value||p.value,method:$('#p_meth').value,account:$('#p_acc').value.trim(),recipient:$('#p_rec').value.trim(),note:$('#p_obs').value.trim()});
  if(f){p.receipt=f;p.receiptName=f.name;p.receiptType=f.type}
  else if(pendingRemoved){delete p.receipt;delete p.receiptName;delete p.receiptType}
  await dbPut(l);$('#dp').close();reload()
}
async function undoPay(){
  const l=loans.find(x=>x.id===cur.id),p=l.parcels[cur.i],keep={};
  if(p.receipt)Object.assign(keep,{receipt:p.receipt,receiptName:p.receiptName,receiptType:p.receiptType});
  l.parcels[cur.i]={due:p.due,value:p.value,paid:false,...keep};await dbPut(l);$('#dp').close();reload()
}

// ---------- relatório ----------
function rows(){
  return scope().flatMap(l=>l.parcels.map((p,i)=>({Empréstimo:l.name,Credor:l.creditor||'',Parcela:`${i+1}/${l.parcels.length}`,Vencimento:fd(p.due),'Valor (R$)':p.value,Situação:ST[stOf(p)],
   'Data pgto':fd(p.paidDate),'Valor pago (R$)':p.paid?(p.paidValue??p.value):'','Meio de pagamento':p.paid?p.method:l.method,'Conta destinatária':p.paid?p.account:l.account,Favorecido:p.paid?p.recipient:l.recipient,Comprovante:p.receipt?'Sim':'Não',Obs:p.note||''})));
}
const title=()=>sel==='all'?'Todos os empréstimos':loans.find(l=>l.id===sel).name;
const fname=ext=>`relatorio-parcelas-${today()}.${ext}`;
function summary(){const s=stats(scope()),saldo=s.total-sum(scope().flatMap(l=>l.parcels).filter(p=>p.paid),p=>p.value);
  return[['Total da dívida',brl(s.total)],['Saldo devedor',brl(saldo)],['Valor pago',brl(s.paidV)],['Parcelas pagas',s.nPaid],['Parcelas a pagar',s.nOpen],['Em atraso',s.nOver]]}
function needData(){if(!scope().length){toast('Nada para exportar');return false}return true}
async function expXlsx(){
  if(!needData())return;const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows());ws['!cols']=[26,18,9,12,12,10,12,14,22,26,22,12,24].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,'Parcelas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Relatório',title()],['Emitido em',fd(today())],...summary()]),'Resumo');
  save(fname('xlsx'),XLSX.write(wb,{type:'array',bookType:'xlsx'}))
}
function expPdf(){
  if(!needData())return;const{jsPDF}=window.jspdf,d=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  d.setFontSize(16);d.text('Relatório de Parcelas de Empréstimos',30,34);d.setFontSize(9);d.text(`${title()} · emitido em ${fd(today())}`,30,48);
  d.text(summary().map(x=>x.join(': ')).join('   |   '),30,62);
  const r=rows(),h=Object.keys(r[0]);
  d.autoTable({startY:74,head:[h],body:r.map(o=>h.map(k=>typeof o[k]==='number'?brl(o[k]):(k==='Valor pago (R$)'&&o[k]!==''?brl(o[k]):o[k]))),styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[31,79,216]},margin:{left:30,right:30},
   didParseCell:c=>{if(c.section==='body'&&c.column.dataKey===5){const v=c.cell.raw;c.cell.styles.textColor=v==='Paga'?[15,157,88]:v==='Atrasada'?[217,48,37]:[183,121,31]}}});
  save(fname('pdf'),d.output('arraybuffer'))
}
async function expImg(){
  if(!needData())return;const r=rows(),h=Object.keys(r[0]);
  $('#rep').innerHTML=`<h2 style="margin:0">Relatório de Parcelas de Empréstimos</h2><div style="color:#555">${esc(title())} · emitido em ${fd(today())}</div>
  <div style="margin:10px 0;display:flex;gap:18px;flex-wrap:wrap">${summary().map(x=>`<div><small style="color:#666">${x[0]}</small><br><b>${x[1]}</b></div>`).join('')}</div>
  <table><tr>${h.map(k=>`<th>${k}</th>`).join('')}</tr>${r.map(o=>`<tr>${h.map(k=>`<td>${esc(typeof o[k]==='number'?brl(o[k]):(k==='Valor pago (R$)'&&o[k]!==''?brl(o[k]):o[k]))}</td>`).join('')}</tr>`).join('')}</table>`;
  try{const c=await html2canvas($('#rep'),{scale:2,backgroundColor:'#fff'});c.toBlob(b=>save(fname('png'),b))}catch(e){toast('Falha ao gerar imagem')}
}

// ---------- backup ----------
const blobToB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
const b64ToBlob=(b64,type)=>{const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type})};
async function backup(){
  const out=await Promise.all(loans.map(async l=>({...l,parcels:await Promise.all(l.parcels.map(async p=>p.receipt?{...p,receipt:undefined,receiptB64:await blobToB64(p.receipt)}:p))})));
  save(`backup-emprestimos-${today()}.json`,JSON.stringify({app:'controle-emprestimos',version:2,exportedAt:new Date().toISOString(),loans:out},null,1));
}
$('#imp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.loans)||j.loans.some(l=>!l.id||!Array.isArray(l.parcels)))throw 0;
    if(!confirm(`Importar ${j.loans.length} empréstimo(s)? Registros com o mesmo ID serão sobrescritos.`))return;
    for(const l of j.loans){
      l.parcels=l.parcels.map(p=>{if(p.receiptB64){const{receiptB64,...rest}=p;return{...rest,receipt:b64ToBlob(receiptB64,p.receiptType||'application/octet-stream')}}return p});
      await dbPut(l);
    }
    await reload();toast('Backup importado')}
  catch{toast('Arquivo de backup inválido')}
};
idbOpen().then(d=>{db=d;reload()}).catch(()=>{$('#list').innerHTML='<div class="card empty">IndexedDB indisponível neste navegador.</div>'});
</script></body></html>
