<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16308a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Empréstimos">
<meta name="description" content="Controle de pagamento de parcelas de empréstimos, com carnê digital, painel e relatórios.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Controle de Empréstimos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef1f7;--card:#fff;--tx:#131c2e;--mut:#6b7688;--bd:#e6e9f0;--pri:#1f4fd8;--pri2:#16308a;
--ok:#0f9d58;--okbg:#e5f6ec;--er:#d93025;--erbg:#fdeceb;--wr:#c17d1f;--wrbg:#fdf1de;--blbg:#eaf0fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#161f30;--tx:#e9edf6;--mut:#8b96ab;--bd:#293148;--pri:#6f93ff;--pri2:#101a33;--ok:#3ecf8e;--okbg:#123226;--er:#ff6b60;--erbg:#391918;--wr:#e6b24d;--wrbg:#332609;--blbg:#182446}}
:root[data-theme="dark"]{--bg:#0d1320;--card:#161f30;--tx:#e9edf6;--mut:#8b96ab;--bd:#293148;--pri:#6f93ff;--pri2:#101a33;--ok:#3ecf8e;--okbg:#123226;--er:#ff6b60;--erbg:#391918;--wr:#e6b24d;--wrbg:#332609;--blbg:#182446}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
.wrap{max-width:480px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 44px;border-radius:0 0 26px 26px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;gap:12px;align-items:flex-start}
.brand-badge{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.brand h1{margin:0;font-size:13px;font-weight:500;opacity:.85}
.brand h1 b{display:block;font-size:19px;font-weight:700;margin-top:1px}
.hero p{margin:10px 0 0;font-size:12.5px;opacity:.8;max-width:280px}
.hero-icons{display:flex;gap:8px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--er);border:1.5px solid var(--pri2)}
main{padding:0 14px 90px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-30px}
.kpi{border-radius:16px;padding:13px;cursor:pointer;border:1px solid #0000000d}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-start}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.kpi label{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:16.5px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.kpi small{color:var(--mut);font-size:11px}
.kpi.b{background:var(--blbg)}.kpi.b .ic{background:#d7e3fb;color:var(--pri2)}
.kpi.g{background:var(--okbg)}.kpi.g .ic{background:#cdefdc;color:var(--ok)}
.kpi.a{background:var(--wrbg)}.kpi.a .ic{background:#fbe4bd;color:var(--wr)}
.chev{color:var(--mut);opacity:.6;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px}
.sec{margin-top:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h h2{display:flex;gap:8px;align-items:center;font-size:15.5px;margin:0}
.sec-h a{color:var(--pri);font-size:12.5px;font-weight:600;text-decoration:none;display:flex;gap:3px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--card);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.d{color:var(--er)}
.btn.w{width:100%;justify-content:center;padding:12px}
.loan{padding:13px;margin-bottom:10px}
.loan-h{display:flex;gap:11px;align-items:center;cursor:pointer}
.loan-ic{width:42px;height:42px;border-radius:12px;background:var(--blbg);color:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.loan-mid{flex:1;min-width:0}
.loan-mid .nm{font-weight:700;font-size:14.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.loan-mid .cr{color:var(--mut);font-size:12px}
.loan-r{text-align:right;font-size:12px;color:var(--mut);flex:0 0 auto}
.loan-r b{display:block;color:var(--tx);font-size:13px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wr{background:var(--wrbg);color:var(--wr)}
.badge.mu{background:var(--bg);color:var(--mut)}.badge.er{background:var(--erbg);color:var(--er)}
.loan-val{font-size:19px;font-weight:700;margin:8px 0 4px}
.progr{display:flex;align-items:center;gap:8px}
.progr .bar{flex:1;height:6px;background:var(--bg);border-radius:6px;overflow:hidden}
.progr .bar i{display:block;height:100%;background:var(--ok)}
.loan.late .progr .bar i{background:var(--wr)}
.progr span{font-size:11px;color:var(--mut);font-weight:600}
.loan-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.meta{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;margin-top:10px}
.parc{border:1px dashed var(--bd);border-radius:10px;padding:9px;cursor:pointer;background:var(--bg);position:relative}
.parc .n{font-weight:700;font-size:12px}.parc .v{font-size:14.5px;font-weight:700;margin:2px 0}.parc small{color:var(--mut);display:block;font-size:10.5px}
.tag{display:inline-block;margin-top:5px;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:700}
.parc.paid{background:var(--okbg)}.paid .tag{background:var(--ok);color:#fff}
.parc.over{background:var(--erbg)}.over .tag{background:var(--er);color:#fff}
.parc.open .tag{background:var(--wrbg);color:var(--wr)}
.clip{position:absolute;top:5px;right:7px;font-size:11px;opacity:.7}
.activity{padding:0}
.act-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--bd)}
.act-row:last-child{border-bottom:none}
.act-row .d{font-size:11.5px;color:var(--mut);width:58px;flex:0 0 auto}
.act-row .nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-row .v{font-size:13px;font-weight:700;flex:0 0 auto}
.empty{text-align:center;color:var(--mut);padding:40px 14px;font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
.tabbar .wrap{display:flex;width:100%}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;background:none;border:none;color:var(--mut);cursor:pointer;font-size:10.5px;position:relative}
.tb svg{font-size:20px}
.tb.on{color:var(--pri)}
.tb.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--pri)}
.installw{background:var(--pri);color:#fff;border-radius:12px;padding:10px 13px;display:none;align-items:center;gap:10px;font-size:12.5px;margin:12px 0 -8px}
.installw.show{display:flex}
.installw button{margin-left:auto;background:#fff;color:var(--pri);border:none;border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer;font-size:12px;flex:0 0 auto}
.rowline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.rowline:last-child{border-bottom:none}.rowline b{font-weight:700}
.confp{padding:14px}.confp h3{margin:0 0 4px;font-size:14px}.confp p{margin:0 0 12px;color:var(--mut);font-size:12px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:20px;width:min(480px,94vw);
 position:fixed;left:0;right:0;bottom:0;top:auto;margin:0 auto;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;
 padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));animation:sheetUp .2s ease-out}
dialog::backdrop{background:#0006}
dialog::before{content:'';display:block;width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 12px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
dialog h3{margin:0 0 12px;font-size:15px}
.f{display:grid;grid-template-columns:1fr;gap:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.f input,.f select,.f textarea{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:14px}
.act{display:flex;flex-direction:column-reverse;gap:8px;margin-top:14px}
.act .btn{width:100%;padding:13px;font-size:15px;justify-content:center}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rec .btn{padding:6px 10px;font-size:12px}
.warn{background:var(--wrbg);color:var(--wr);border-radius:8px;padding:8px 10px;font-size:12px}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:30;font-size:13px;max-width:88vw;text-align:center}
#rep{position:fixed;left:-99999px;top:0;width:1100px;background:#fff;color:#111;padding:28px;font:13px Arial,sans-serif}
#rep table{width:100%;border-collapse:collapse;margin-top:10px}#rep th{background:#1f4fd8;color:#fff;text-align:left}#rep th,#rep td{padding:5px 7px;border:1px solid #d5dbe6;font-size:11px}
</style></head><body>
<div class="hero"><div class="wrap">
<div class="hero-top">
<div class="brand"><div class="brand-badge" id="icWallet"></div>
<h1>Controle de<b>Empréstimos</b></h1></div>
<div class="hero-icons">
<button class="icon-btn" id="bellBtn" title="Parcelas vencidas"></button>
<button class="icon-btn" onclick="setTab('config')" title="Configurações" id="profBtn"></button>
</div></div>
<p>Acompanhe seus empréstimos e mantenha seus pagamentos em dia.</p>
</div></div>
<main class="wrap"><div id="view"></div></main>
<div class="tabbar"><div class="wrap">
<button class="tb" data-t="inicio" onclick="setTab('inicio')"></button>
<button class="tb" data-t="emprestimos" onclick="setTab('emprestimos')"></button>
<button class="tb" data-t="relatorios" onclick="setTab('relatorios')"></button>
<button class="tb" data-t="config" onclick="setTab('config')"></button>
</div></div>

<dialog id="dl"><form method="dialog" onsubmit="return false"><h3 id="l_t">Novo empréstimo</h3><div class="f">
<label>Nome / descrição<input id="l_name" required placeholder="Ex.: Financiamento do carro"></label>
<label>Credor / instituição<input id="l_cred"></label>
<label>Nº de parcelas<input id="l_n" type="number" min="1" max="600" value="12"></label>
<label>Valor da parcela (R$)<input id="l_val" type="number" step="0.01" min="0"></label>
<label>1º vencimento<input id="l_due" type="date"></label>
<label>Meio de pagamento padrão<select id="l_meth"></select></label>
<label>Conta destinatária<input id="l_acc" placeholder="Banco / ag / conta / chave PIX"></label>
<label>Favorecido (nome)<input id="l_rec"></label></div>
<div id="l_warn"></div>
<div class="act"><button class="btn" onclick="$('#dl').close()">Cancelar</button><button class="btn p" id="l_save" onclick="saveLoan()">Criar carnê</button></div></form></dialog>

<dialog id="dp"><form method="dialog" onsubmit="return false"><h3 id="p_t"></h3><div class="f">
<label>Data em que foi paga<input id="p_date" type="date"></label>
<label>Valor pago (R$)<input id="p_val" type="number" step="0.01"></label>
<label>Meio de pagamento<select id="p_meth"></select></label>
<label>Conta destinatária<input id="p_acc"></label>
<label>Favorecido (nome)<input id="p_rec"></label>
<label><span id="p_hint" style="color:var(--mut);font-weight:400"></span></label>
<label>Observação<textarea id="p_obs" rows="2"></textarea></label>
<label>Comprovante (imagem ou PDF)
 <div class="rec"><input id="p_file" type="file" accept="image/*,.pdf,application/pdf" style="flex:1;min-width:160px">
 <button type="button" class="btn" id="p_view" style="display:none" onclick="viewReceipt()">Ver</button>
 <button type="button" class="btn d" id="p_rm" style="display:none" onclick="rmReceipt()">Remover</button></div>
 <small id="p_recinfo" style="color:var(--mut)"></small></label></div>
<div class="act"><button class="btn d" id="p_undo" onclick="undoPay()">Desfazer pagamento</button><button class="btn" onclick="$('#dp').close()">Cancelar</button><button class="btn p" onclick="doPay()">Marcar como paga</button></div></form></dialog>
<div id="toast"></div><div id="rep"></div>

<script>
const $=s=>document.querySelector(s);
const METHODS=['PIX','Boleto','Transferência (TED/DOC)','Débito automático','Cartão','Dinheiro','Outro'];
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const fdShort=d=>d?d.split('-').slice(1).reverse().join('/'):'—';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pad=n=>String(n).padStart(2,'0');
const dueOf=(s,i)=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+i,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(Math.min(d,last))};
const stOf=p=>p.paid?'paid':(p.due<today()?'over':'open');
const ST={paid:'Paga',over:'Vencida',open:'A pagar'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysDiff=d=>Math.round((new Date(d)-new Date(today()))/864e5);
let db,loans=[],sel='all',cur=null,editId=null,pendingRemoved=false;
let tab='inicio',expanded={},focusLoan=null;

// ---------- ícones (SVG inline, sem libs externas) ----------
const I={
 card:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/>',
 stack:'<path d="M4 8l8-4 8 4-8 4-8-4Z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/>',
 calendar:'<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="3" y1="10" x2="21" y2="10"/>',
 check:'<circle cx="12" cy="12" r="9.5"/><polyline points="8 12.2 10.8 15 16 9.5"/>',
 clock:'<circle cx="12" cy="12" r="9.5"/><line x1="12" y1="12" x2="12" y2="7"/><line x1="12" y1="12" x2="15.5" y2="14.3"/>',
 car:'<path d="M4.5 11.5 6 6.8h12l1.5 4.7"/><rect x="2.7" y="11.3" width="18.6" height="6.2" rx="2"/><circle cx="7.3" cy="17.7" r="1.7"/><circle cx="16.7" cy="17.7" r="1.7"/>',
 users:'<circle cx="8.5" cy="8" r="3.2"/><path d="M2.3 20c0-3.4 2.8-6.1 6.2-6.1s6.2 2.7 6.2 6.1"/><circle cx="17.3" cy="8.6" r="2.4"/><path d="M14.8 20c.1-2.7 2.1-4.8 4.9-5.1"/>',
 file:'<rect x="5" y="2.5" width="14" height="19" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12.2" x2="16" y2="12.2"/><line x1="8" y1="16.4" x2="13" y2="16.4"/>',
 bell:'<path d="M6 8.5a6 6 0 0 1 12 0c0 4.8 1.8 5.8 1.8 5.8H4.2S6 13.3 6 8.5Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 user:'<circle cx="12" cy="8.2" r="3.7"/><path d="M4 20c0-4.2 3.6-7.6 8-7.6s8 3.4 8 7.6"/>',
 home:'<path d="M4 11 12 4l8 7"/><path d="M6 10v10.5h12V10"/>',
 list:'<line x1="9" y1="6.5" x2="21" y2="6.5"/><line x1="9" y1="12.5" x2="21" y2="12.5"/><line x1="9" y1="18.5" x2="21" y2="18.5"/><circle cx="4" cy="6.5" r="1.4"/><circle cx="4" cy="12.5" r="1.4"/><circle cx="4" cy="18.5" r="1.4"/>',
 chart:'<rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/>',
 sliders:'<line x1="4" y1="6" x2="20" y2="6"/><circle cx="15" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="9" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="16" cy="18" r="2"/>',
 chevr:'<polyline points="9 6 15 12 9 18"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 edit:'<path d="M4 20h4l10.5-10.5a2.4 2.4 0 0 0-4-4L4 16v4Z"/>',
 trash:'<path d="M4 6.5h16"/><path d="M8.5 6.5v-2h7v2"/><path d="M18 6.5 17 20H7L6 6.5"/>',
 down:'<path d="M12 3v12"/><path d="M7 10.5l5 5 5-5"/><path d="M5 21h14"/>',
 up:'<path d="M12 21V9"/><path d="M7 13.5l5-5 5 5"/><path d="M5 3h14"/>',
 img:'<rect x="3" y="3.5" width="18" height="17" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="M20.5 16 15 10.5 5 20.5"/>',
 sheet:'<rect x="3" y="3.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="9.5" y1="3.5" x2="9.5" y2="20.5"/>',
 close:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
};
const ic=(k,size)=>`<svg class="i" viewBox="0 0 24 24" ${size?`style="font-size:${size}px"`:''}>${I[k]||''}</svg>`;
$('#icWallet').innerHTML=ic('card',20);
$('#bellBtn').innerHTML=ic('bell',17);
$('#profBtn').innerHTML=ic('user',17);
const TABS=[['inicio','home','Início'],['emprestimos','list','Empréstimos'],['relatorios','chart','Relatórios'],['config','sliders','Config.']];
$('.tabbar .wrap').innerHTML=TABS.map(([k,i,l])=>`<button class="tb" data-t="${k}" onclick="setTab('${k}')">${ic(i,20)}<span>${l}</span></button>`).join('');
document.querySelectorAll('select').forEach(s=>s.innerHTML=METHODS.map(m=>`<option>${m}</option>`).join(''));

function loanIcon(name){
  name=(name||'').toLowerCase();
  if(/ve[íi]cul|carro|moto|auto|financ/.test(name))return 'car';
  if(/pessoal|consignad/.test(name))return 'users';
  if(/cart[ãa]o/.test(name))return 'card';
  return 'file';
}

// ---------- IndexedDB ----------
const idbOpen=()=>new Promise((ok,no)=>{const r=indexedDB.open('emprestimos_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('loans',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const os=m=>db.transaction('loans',m).objectStore('loans');
const dbPut=l=>rq(os('readwrite').put(l)),dbDel=id=>rq(os('readwrite').delete(id)),dbAll=()=>rq(os('readonly').getAll());
async function reload(){loans=(await dbAll()).sort((a,b)=>a.created-b.created);if(sel!=='all'&&!loans.find(l=>l.id===sel))sel='all';render()}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
function save(filename,data){
  const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',png:'image/png',json:'application/json'};
  const ext=filename.split('.').pop().toLowerCase();
  const blob=(data instanceof Blob)?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
  toast('Arquivo baixado: '+filename);
}
const scope=()=>sel==='all'?loans:loans.filter(l=>l.id===sel);
const sum=(ps,f)=>ps.reduce((a,p)=>a+f(p),0);
const stats=ls=>{const ps=ls.flatMap(l=>l.parcels);const paid=ps.filter(p=>p.paid);return{total:sum(ps,p=>p.value),paidV:sum(paid,p=>p.paidValue??p.value),nPaid:paid.length,nOpen:ps.length-paid.length,nOver:ps.filter(p=>stOf(p)==='over').length,n:ps.length,overV:sum(ps.filter(p=>stOf(p)==='over'),p=>p.value)}};
function loanStatus(l){const s=stats([l]);if(s.nOver)return'wr';if(s.nPaid===s.n)return'mu';return'ok'}
const loanStatusLabel={ok:'Ativo',wr:'Em atraso',mu:'Quitado'};
function nextParcel(l){return l.parcels.find(p=>!p.paid)}

// ---------- tabs ----------
function setTab(t){tab=t;$('#toast').style.display='none';render();window.scrollTo({top:0,behavior:'instant'})}

// ---------- render dispatch ----------
function render(){
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const overN=loans.flatMap(l=>l.parcels).filter(p=>stOf(p)==='over').length;
  $('#bellBtn').innerHTML=ic('bell',17)+(overN?`<span class="dot"></span>`:'');
  const v=$('#view');
  if(!loans.length&&tab!=='config'){
    v.innerHTML=`<div class="sec"><div class="card empty">${ic('file',26)}<br><br>Nenhum empréstimo cadastrado ainda.<br><br><button class="btn p" onclick="newLoan()">${ic('plus',15)} Criar primeiro carnê</button></div></div>`;
    return;
  }
  if(tab==='inicio')return renderInicio(v);
  if(tab==='emprestimos')return renderEmprestimos(v);
  if(tab==='relatorios')return renderRelatorios(v);
  renderConfig(v);
}

// ---------- empréstimo ----------
function newLoan(){
  editId=null;$('#l_t').textContent='Novo empréstimo';$('#l_save').textContent='Criar carnê';$('#l_warn').innerHTML='';
  ['name','cred','val','acc','rec'].forEach(k=>$('#l_'+k).value='');$('#l_n').value=12;$('#l_due').value=today();$('#dl').showModal()
}
function editLoan(id){
  const l=loans.find(x=>x.id===id);editId=id;
  $('#l_t').textContent='Editar empréstimo';$('#l_save').textContent='Salvar alterações';
  $('#l_name').value=l.name;$('#l_cred').value=l.creditor||'';$('#l_n').value=l.parcels.length;$('#l_val').value=l.parcels[0]?.value??'';
  $('#l_due').value=l.parcels[0]?.due||today();$('#l_meth').value=l.method;$('#l_acc').value=l.account||'';$('#l_rec').value=l.recipient||'';
  const paidCount=l.parcels.filter(p=>p.paid).length;
  $('#l_warn').innerHTML=paidCount?`<div class="warn">Este empréstimo tem ${paidCount} parcela(s) já paga(s). Elas não serão alteradas; mudanças em valor/vencimento valem só para as parcelas em aberto, e o nº de parcelas não pode ficar menor que ${paidCount}.</div>`:'';
  $('#dl').showModal();
}
async function saveLoan(){
  const name=$('#l_name').value.trim(),n=+$('#l_n').value,val=+$('#l_val').value,due=$('#l_due').value;
  if(!name||!n||!(val>0)||!due)return toast('Preencha nome, nº de parcelas, valor e 1º vencimento');
  const meta={name,creditor:$('#l_cred').value.trim(),method:$('#l_meth').value,account:$('#l_acc').value.trim(),recipient:$('#l_rec').value.trim()};
  if(!editId){
    const l={id:'l'+Date.now(),created:Date.now(),...meta,parcels:Array.from({length:n},(_,i)=>({due:dueOf(due,i),value:val,paid:false}))};
    await dbPut(l);$('#dl').close();await reload();focusLoan=l.id;setTab('emprestimos');return;
  }
  const l=loans.find(x=>x.id===editId),paidCount=l.parcels.filter(p=>p.paid).length;
  if(n<paidCount)return toast(`Não é possível ter menos parcelas que as ${paidCount} já pagas`);
  const parcels=Array.from({length:n},(_,i)=>{const old=l.parcels[i];if(old&&old.paid)return old;return{due:dueOf(due,i),value:val,paid:false}});
  Object.assign(l,meta);l.parcels=parcels;
  await dbPut(l);editId=null;$('#dl').close();reload();
}
async function delLoan(id){if(!confirm('Excluir este empréstimo e todo o histórico de pagamentos?'))return;await dbDel(id);reload()}

// ---------- pagamento ----------
function openPay(id,i){
  const l=loans.find(x=>x.id===id),p=l.parcels[i];cur={id,i};pendingRemoved=false;
  $('#p_t').textContent=`${l.name} — parcela ${i+1}/${l.parcels.length} (venc. ${fd(p.due)})`;
  $('#p_date').value=p.paidDate||today();$('#p_val').value=p.paidValue??p.value;
  $('#p_meth').value=p.method||l.method;$('#p_acc').value=p.account??l.account;$('#p_rec').value=p.recipient??l.recipient;$('#p_obs').value=p.note||'';
  $('#p_hint').textContent=(!p.paid&&p.due<today())?`Parcela vencida em ${fd(p.due)}. Informe a data em que o pagamento foi realmente feito.`:'Você pode informar uma data diferente do vencimento.';
  $('#p_file').value='';
  const has=!!p.receipt;$('#p_view').style.display=has?'':'none';$('#p_rm').style.display=has?'':'none';
  $('#p_recinfo').textContent=has?`Anexado: ${p.receiptName||'comprovante'}`:'Nenhum comprovante anexado.';
  $('#p_undo').style.display=p.paid?'':'none';$('#dp').showModal()
}
function viewReceipt(){const l=loans.find(x=>x.id===cur.id),p=l.parcels[cur.i];if(!p.receipt)return;const u=URL.createObjectURL(p.receipt);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
function rmReceipt(){pendingRemoved=true;$('#p_view').style.display='none';$('#p_rm').style.display='none';$('#p_recinfo').textContent='Comprovante será removido ao salvar.'}
async function doPay(){
  const l=loans.find(x=>x.id===cur.id),p=l.parcels[cur.i];
  if(!$('#p_date').value)return toast('Informe a data do pagamento');
  const f=$('#p_file').files[0];
  if(f&&f.size>15*1024*1024)return toast('Comprovante muito grande (máx. 15 MB)');
  Object.assign(p,{paid:true,paidDate:$('#p_date').value,paidValue:+$('#p_val').value||p.value,method:$('#p_meth').value,account:$('#p_acc').value.trim(),recipient:$('#p_rec').value.trim(),note:$('#p_obs').value.trim()});
  if(f){p.receipt=f;p.receiptName=f.name;p.receiptType=f.type}
  else if(pendingRemoved){delete p.receipt;delete p.receiptName;delete p.receiptType}
  await dbPut(l);$('#dp').close();reload()
}
async function undoPay(){
  const l=loans.find(x=>x.id===cur.id),p=l.parcels[cur.i],keep={};
  if(p.receipt)Object.assign(keep,{receipt:p.receipt,receiptName:p.receiptName,receiptType:p.receiptType});
  l.parcels[cur.i]={due:p.due,value:p.value,paid:false,...keep};await dbPut(l);$('#dp').close();reload()
}

   'Data pgto':fd(p.paidDate),'Valor pago (R$)':p.paid?(p.paidValue??p.value):'','Meio de pagamento':p.paid?p.method:l.method,'Conta destinatária':p.paid?p.account:l.account,Favorecido:p.paid?p.recipient:l.recipient,Comprovante:p.receipt?'Sim':'Não',Obs:p.note||''})));

// ---------- backup ----------
const blobToB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
const b64ToBlob=(b64,type)=>{const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type})};
async function backup(){
  const out=await Promise.all(loans.map(async l=>({...l,parcels:await Promise.all(l.parcels.map(async p=>p.receipt?{...p,receipt:undefined,receiptB64:await blobToB64(p.receipt)}:p))})));
  save(`backup-emprestimos-${today()}.json`,JSON.stringify({app:'controle-emprestimos',version:2,exportedAt:new Date().toISOString(),loans:out},null,1));
}
async function importBackup(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.loans)||j.loans.some(l=>!l.id||!Array.isArray(l.parcels)))throw 0;
    if(!confirm(`Importar ${j.loans.length} empréstimo(s)? Registros com o mesmo ID serão sobrescritos.`))return;
    for(const l of j.loans){
      l.parcels=l.parcels.map(p=>{if(p.receiptB64){const{receiptB64,...rest}=p;return{...rest,receipt:b64ToBlob(receiptB64,p.receiptType||'application/octet-stream')}}return p});
      await dbPut(l);
    }
    await reload();toast('Backup importado')}
  catch{toast('Arquivo de backup inválido')}
}

// ---------- PWA: service worker e instalação ----------
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('Nova versão baixada — reabra o app para atualizar')});
      });
    }).catch(()=>{});
  });
}
let deferredInstall=null;
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function syncInstallBar(){
  const bar=$('#installBar');if(!bar)return;
  if(standalone()){bar.classList.remove('show');return}
  if(deferredInstall||isIOS())bar.classList.add('show');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;syncInstallBar()});
async function doInstall(){
  if(isIOS()&&!deferredInstall){toast('No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".');return}
  if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#installBar')?.classList.remove('show');
}
window.addEventListener('appinstalled',()=>$('#installBar')?.classList.remove('show'));

idbOpen().then(d=>{db=d;reload()}).catch(()=>{$('#view').innerHTML='<div class="sec"><div class="card empty">IndexedDB indisponível neste navegador.</div></div>'});
</script></body></html>
